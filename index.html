<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7a123f" />
    <meta name="description" content="A simple two-team Codenames board you can play in the browser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codenames" />
    <title>Codenames</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=9" />
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <filter id="stamp" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>Codenames</h1>
          <p id="turn-line" class="turn-line">Blue starts</p>
        </div>
        <div class="scores" aria-live="polite">
          <div class="score red" id="score-red">
            <span class="score-label">Red</span>
            <span class="score-value">8</span>
          </div>
          <div class="score blue" id="score-blue">
            <span class="score-label">Blue</span>
            <span class="score-value">7</span>
          </div>
        </div>
      </header>

      <main>
        <div id="board" class="board" aria-label="Codenames board"></div>
        <p id="status" class="status" aria-live="assertive"></p>
      </main>

      <footer class="controls">
        <button type="button" id="key-btn" class="btn ghost" aria-pressed="false">
          Show key
        </button>
        <button type="button" id="new-btn" class="btn">New game</button>
      </footer>
    </div>

    <div id="overlay" class="overlay" aria-hidden="true">
      <svg class="overlay-spies" viewBox="0 0 640 360" aria-hidden="true">
        <g fill="#111">
          <g transform="translate(86 42)">
            <ellipse cx="78" cy="28" rx="22" ry="24" />
            <path d="M56 50c-4 10-6 16-14 26l12 8 10-18 8 20 14-6c-2-14-4-24-8-32z" />
            <path d="M48 96l-18 78h28l8-36 10 36h30L88 96c-4-18-8-28-22-32-12 4-16 16-18 32z" />
            <path d="M38 176l-8 86 22 4 10-70 8 70 24-2-10-90z" />
            <path d="M30 262h22l4 28-30 8zM86 260h24l8 32-28 4z" />
          </g>
          <g transform="translate(338 36)">
            <ellipse cx="86" cy="30" rx="23" ry="26" />
            <rect x="68" y="54" width="36" height="18" rx="3" />
            <path d="M48 72h76l8 108H42z" />
            <path d="M42 180l-6 92h28l8-70 10 70h30l-8-92z" />
            <path d="M40 272h26l2 24-30 6zM96 272h30l4 28-32 2z" />
            <rect x="82" y="78" width="10" height="86" fill="#f4f4f4" opacity="0.95" />
          </g>
        </g>
        <g fill="#f4f4f4">
          <path d="M148 92c8 2 16 0 22-6v14c-8 4-16 6-24 4z" />
          <path d="M410 94c10 2 18 0 24-6v16c-8 4-18 6-26 4z" />
        </g>
      </svg>
      <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <p id="overlay-kicker" class="overlay-kicker"></p>
        <h2 id="overlay-title" class="overlay-title"></h2>
        <button type="button" id="restart-btn" class="btn overlay-btn">Restart</button>
      </div>
    </div>
    <script type="module" src="./app.js?v=8"></script>
  </body>
</html>
